name: Build Aura APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure .env.example exists as .env
      run: |
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
        fi
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Run Tests and Build Debug APK
      run: ./gradlew test assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: aura-debug-apk
        path: app/build/outputs/apk/debug/*.apk
